<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="walBody" x1="32" y1="118" x2="224" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6ECF5"/>
    </linearGradient>
    <linearGradient id="walFlap" x1="32" y1="118" x2="200" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F6FB"/>
    </linearGradient>
    <linearGradient id="walEdge" x1="128" y1="214" x2="128" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C0CAD8"/>
      <stop offset="100%" stop-color="#A9B4C6"/>
    </linearGradient>
    <linearGradient id="walSpec" x1="40" y1="118" x2="40" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cordGrad" x1="70" y1="80" x2="120" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE16A"/>
      <stop offset="50%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#E8B82A"/>
    </linearGradient>
    <linearGradient id="miniPlug" x1="48" y1="44" x2="92" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6ECF5"/>
    </linearGradient>
    <linearGradient id="snapGrad" x1="116" y1="166" x2="140" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A3D68"/>
      <stop offset="55%" stop-color="#0B1530"/>
      <stop offset="100%" stop-color="#070E20"/>
    </linearGradient>
    <filter id="walShadow" x="-25%" y="-20%" width="150%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="b"/>
      <feOffset in="b" dx="0" dy="8" result="o"/>
      <feFlood flood-color="#0B1530" flood-opacity="0.28" result="f"/>
      <feComposite in="f" in2="o" operator="in"/>
    </filter>
    <filter id="flapShadow" x="-10%" y="0%" width="120%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b"/>
      <feOffset in="b" dx="0" dy="2.5" result="o"/>
      <feFlood flood-color="#0B1530" flood-opacity="0.18" result="f"/>
      <feComposite in="f" in2="o" operator="in"/>
    </filter>
    <filter id="miniPlugSh" x="-40%" y="-30%" width="180%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b"/>
      <feOffset in="b" dx="0" dy="2.2" result="o"/>
      <feFlood flood-color="#0B1530" flood-opacity="0.28" result="f"/>
      <feComposite in="f" in2="o" operator="in"/>
    </filter>
    <filter id="cordSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Grounded group: thickness, body, flap, snap, cord, plug -->
  <g filter="url(#walShadow)">
    <rect x="32" y="126" width="192" height="108" rx="24" fill="url(#walEdge)"/>
  </g>
  <rect x="32" y="118" width="192" height="108" rx="24" fill="url(#walBody)"/>

  <!-- Flap (top portion of the bifold) -->
  <g filter="url(#flapShadow)">
    <path d="M32 142 V142 V142" fill="none"/>
    <path d="M32 142 C32 142 32 118 32 118 H224 C224 118 224 142 224 142
             C198 148 158 152 128 152 C98 152 58 148 32 142 Z" fill="#0B1530" opacity="0"/>
    <path d="M32 118 H224 A24 24 0 0 1 224 142
             C198 148 158 152 128 152 C98 152 58 148 32 142
             A24 24 0 0 1 32 118 Z" fill="url(#walFlap)"/>
  </g>
  <path d="M32 118 H224 A24 24 0 0 1 224 142
           C198 148 158 152 128 152 C98 152 58 148 32 142
           A24 24 0 0 1 32 118 Z" fill="url(#walFlap)"/>
  <path d="M32 118 H224 A24 24 0 0 1 224 142
           C198 148 158 152 128 152 C98 152 58 148 32 142
           A24 24 0 0 1 32 118 Z" fill="url(#walSpec)"/>
  <path d="M48 142 C76 148 104 151 128 151 C152 151 180 148 208 142"
        fill="none" stroke="#C9D1DE" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Center snap -->
  <circle cx="128" cy="178" r="12.5" fill="url(#snapGrad)"/>
  <circle cx="128" cy="178" r="7.5" fill="none" stroke="#2A3D68" stroke-width="2.2"/>
  <circle cx="128" cy="178" r="7.5" fill="none" stroke="#152148" stroke-width="2.2" opacity="0.5"/>
  <ellipse cx="124.5" cy="174.5" rx="5" ry="3.6" fill="#FFFFFF" opacity="0.35"/>

  <!-- Yellow cord from the plug into the flap -->
  <path d="M72 86 C70 108, 86 128, 116 134" fill="none" stroke="url(#cordGrad)"
        stroke-width="12" stroke-linecap="round"/>
  <path d="M72 86 C70 108, 86 128, 116 134" fill="none" stroke="#FFE16A"
        stroke-width="4.5" stroke-linecap="round" opacity="0.45" filter="url(#cordSoft)"/>

  <!-- Mini glossy plug; hairline so prongs read on white -->
  <g filter="url(#miniPlugSh)">
    <rect x="56" y="36" width="12" height="30" rx="6" fill="#000"/>
    <rect x="72" y="36" width="12" height="30" rx="6" fill="#000"/>
    <rect x="48" y="60" width="44" height="36" rx="12" fill="#000"/>
  </g>
  <rect x="56" y="36" width="12" height="30" rx="6" fill="#F7F9FC" stroke="#C9D1DE" stroke-width="1.4"/>
  <rect x="72" y="36" width="12" height="30" rx="6" fill="#F7F9FC" stroke="#C9D1DE" stroke-width="1.4"/>
  <rect x="48" y="60" width="44" height="36" rx="12" fill="url(#miniPlug)" stroke="#C9D1DE" stroke-width="1.4"/>
  <rect x="52" y="64" width="28" height="14" rx="7" fill="#FFFFFF" opacity="0.55"/>
</svg>